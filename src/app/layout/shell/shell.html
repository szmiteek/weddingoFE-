<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__brand-mark">
        <img src="/logo-icon.png" alt="" />
      </span>
      <div>
        <img class="sidebar__brand-name" src="/logo-wordmark.png" alt="Weddingo" />
        <div class="sidebar__brand-sub">{{ authService.currentUser()?.companyName }}</div>
      </div>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a class="sidebar__link" [routerLink]="item.path" routerLinkActive="is-active">
          <span class="sidebar__link-icon">
            @switch (item.icon) {
              @case ('grid') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="3" width="7" height="7" rx="1.5" />
                  <rect x="14" y="3" width="7" height="7" rx="1.5" />
                  <rect x="3" y="14" width="7" height="7" rx="1.5" />
                  <rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
              }
              @case ('file') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6.5 2.5Z" />
                  <path d="M14 2.5V8h5" />
                  <path d="M8.5 12.5h7M8.5 16h5" />
                </svg>
              }
              @case ('calendar') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="4.5" width="18" height="16" rx="2" />
                  <path d="M3 9.5h18M8 2.5v4M16 2.5v4" />
                </svg>
              }
              @case ('users') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="9" cy="8" r="3.2" />
                  <path d="M2.8 20c.7-3.4 3.3-5.5 6.2-5.5s5.5 2.1 6.2 5.5" />
                  <circle cx="17.5" cy="8.5" r="2.5" />
                  <path d="M15.8 14.7c2.2.4 4 2.2 4.6 5.3" />
                </svg>
              }
              @case ('building') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="4" y="3" width="12" height="18" rx="1" />
                  <path d="M9 8h2M9 12h2M9 16h2M16 10h4v11h-4" />
                </svg>
              }
              @case ('settings') {
                <span class="material-symbols-outlined">settings</span>
              }
            }
          </span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <button type="button" class="sidebar__logout" (click)="logout()">Wyloguj</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
