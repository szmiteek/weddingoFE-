<div class="login-page">
  <div class="card login-card">
    <div class="card__header login-card__header">
      <div>
        <h1 class="login-logo">
          <img src="/logo-full.png" alt="Weddingo" />
        </h1>
        <p class="text-muted" style="margin-top: .3rem;">Zaloguj się do panelu zarządzania</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="card__body">
        <div class="field">
          <label class="field__label">E-mail</label>
          <input class="input" type="email" formControlName="email" autocomplete="username" required />
        </div>
        <div class="field" style="margin-bottom: 1.5rem;">
          <label class="field__label">Hasło</label>
          <input class="input" type="password" formControlName="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" [disabled]="loading()">
          {{ loading() ? 'Logowanie…' : 'Zaloguj się' }}
        </button>
      </div>
    </form>
  </div>
</div>
