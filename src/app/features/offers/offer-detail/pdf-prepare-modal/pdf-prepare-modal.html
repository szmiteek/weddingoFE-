<div class="modal-backdrop">
  <div class="modal-panel modal-panel--wide" [class.modal-panel--pricing]="step() === 2">
    <div class="modal-header">
      <h2>Przygotuj ofertę PDF</h2>
      <button type="button" class="modal-close" (click)="close.emit()" aria-label="Zamknij">✕</button>
    </div>

    <div class="wizard-steps">
      <div class="wizard-steps__step" [class.is-active]="step() === 1">
        <span class="wizard-steps__dot">1</span>
        <span>Dane ogólne</span>
      </div>
      <span class="wizard-steps__sep"></span>
      <div class="wizard-steps__step" [class.is-active]="step() === 2">
        <span class="wizard-steps__dot">2</span>
        <span>Wycena i opis</span>
      </div>
    </div>

    @if (step() === 1) {
      <div [formGroup]="form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field">
              <label class="field__label">Data</label>
              <input class="input" type="date" formControlName="date" />
            </div>
            <div class="field">
              <label class="field__label">Miejsce</label>
              <input class="input" formControlName="venue" />
            </div>
            <div class="field">
              <label class="field__label">Liczba gości</label>
              <input class="input" type="number" formControlName="guests" />
            </div>
            <div class="field">
              <label class="field__label">Kolorystyka</label>
              <input class="input" formControlName="colors" />
            </div>
            <div class="field">
              <label class="field__label">Stół prezydialny</label>
              <input class="input" formControlName="mainTable" />
            </div>
            <div class="field">
              <label class="field__label">Stoły gości</label>
              <input class="input" formControlName="guestsTable" />
            </div>
          </div>

          <div class="field">
            <label class="field__label">Kwiaty</label>
            <input class="input" formControlName="flowers" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close.emit()">Anuluj</button>
        <button type="button" class="btn btn-primary" (click)="nextStep()">Dalej</button>
      </div>
    }

    @if (step() === 2) {
      <div class="modal-body">
        <div class="pricing-layout">
          <div class="pricing-table-col">
            <app-event-elements-table [offerId]="offer().id" [elements]="elements()" (changed)="onElementsChanged($event)" />
          </div>

          <div class="pricing-desc-col" [formGroup]="pricingForm">
            <div class="field">
              <label class="field__label">Opis dekoracji</label>
              <textarea class="textarea" rows="6" formControlName="description"></textarea>
              <span class="field__hint">Zmiany zapiszą się też w ofercie po wygenerowaniu pliku.</span>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="previousStep()">Wstecz</button>
        <button type="button" class="btn btn-primary" (click)="submit()">
          <span class="material-symbols-outlined">picture_as_pdf</span>
          Generuj PDF
        </button>
      </div>
    }
  </div>
</div>
