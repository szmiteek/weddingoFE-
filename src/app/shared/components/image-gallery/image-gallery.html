@if (images().length === 0) {
  <div class="empty-state">
    <div class="empty-state__icon">🖼️</div>
    <p>{{ emptyText() }}</p>
  </div>
} @else {
  <div class="image-gallery">
    @for (image of images(); track image.id; let i = $index) {
      <div class="image-gallery__item">
        @if (urlFor(image); as url) {
          <img [src]="url" [alt]="image.filename" loading="lazy" />
        }
        <button
          type="button"
          class="image-gallery__open"
          (click)="openLightbox(i)"
          [attr.aria-label]="'Otwórz zdjęcie ' + image.filename"
          [title]="image.filename"
        ></button>
        @if (deletable()) {
          <button
            type="button"
            class="image-gallery__remove"
            (click)="removeClicked(image, $event)"
            aria-label="Usuń zdjęcie"
            title="Usuń zdjęcie"
          >
            ✕
          </button>
        }
      </div>
    }
  </div>

  @if (lightboxOpen()) {
    <app-image-lightbox
      [images]="lightboxImages()"
      [(index)]="lightboxIndex"
      (close)="lightboxOpen.set(false)"
    />
  }
}
