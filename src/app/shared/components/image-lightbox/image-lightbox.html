<div class="lightbox" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia" (click)="onBackdropClick($event)">
  <button type="button" class="lightbox__close" (click)="close.emit()" aria-label="Zamknij podgląd" title="Zamknij">
    <span class="material-symbols-outlined">close</span>
  </button>

  @if (hasPrevious()) {
    <button
      type="button"
      class="lightbox__nav lightbox__nav--prev"
      (click)="previous()"
      aria-label="Poprzednie zdjęcie"
      title="Poprzednie"
    >
      <span class="material-symbols-outlined">chevron_left</span>
    </button>
  }

  @if (current(); as image) {
    <figure class="lightbox__figure" (click)="onBackdropClick($event)">
      @if (image.url) {
        <img class="lightbox__image" [src]="image.url" [alt]="image.caption ?? 'Zdjęcie'" />
      } @else {
        <div class="lightbox__loading">Wczytywanie zdjęcia…</div>
      }
      <figcaption class="lightbox__caption">
        <span class="lightbox__counter">{{ index() + 1 }} / {{ images().length }}</span>
        @if (image.caption) {
          <span class="lightbox__filename">{{ image.caption }}</span>
        }
      </figcaption>
    </figure>
  }

  @if (hasNext()) {
    <button
      type="button"
      class="lightbox__nav lightbox__nav--next"
      (click)="next()"
      aria-label="Następne zdjęcie"
      title="Następne"
    >
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  }
</div>
